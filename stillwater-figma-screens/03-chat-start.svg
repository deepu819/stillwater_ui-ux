<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg"><rect width="390" height="844" fill="#FAF8F3"/><rect width="390" height="64" fill="#FAF8F3"/><line x1="0" y1="64" x2="390" y2="64" stroke="#EDE7DC"/><text x="24" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#23211E">Stillwater</text><rect x="120" y="22" width="122" height="24" rx="12" fill="#F2EDE4"/><circle cx="134" cy="34" r="3.5" fill="#6E8B75"/><text x="144" y="38" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#57524A">quiet-river-42</text><text x="258" y="38" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#57524A">Talk to a human</text><text x="366" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#8B8477" text-anchor="end">···</text><text x="195" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#8B8477" text-anchor="middle">Nothing here is being kept about you unless you ask.</text><text x="26" y="132" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1.2" fill="#8B8477">STILLWATER</text><rect x="24" y="140" width="300" height="76" rx="18" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1"/><path d="M24 208 h12 v6 z" fill="#E6E1D8"/><text x="40" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#57524A">I'm here. Nothing has to be</text><text x="40" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#57524A">explained properly, and there is</text><text x="40" y="206" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#57524A">no right way to start.</text><text x="26" y="252" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1.2" fill="#8B8477">STILLWATER</text><rect x="24" y="260" width="228" height="46" rx="18" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1"/><path d="M24 298 h12 v6 z" fill="#E6E1D8"/><text x="40" y="286" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#57524A">I'm listening. Take your time.</text><rect x="24" y="700" width="176" height="34" rx="17" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1"/><text x="112.0" y="722" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#57524A" text-anchor="middle">I don't know what to say</text><rect x="208" y="700" width="158" height="34" rx="17" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1"/><text x="287.0" y="722" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#57524A" text-anchor="middle">I'd like to breathe first</text><rect x="16" y="756" width="358" height="58" rx="29" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1"/><text x="38" y="791" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#8B8477">Type whatever is there. Short is fine.</text><circle cx="344" cy="785" r="19" fill="#4E6B57"/><path d="M337 785 h13 M345 779 l6 6 -6 6" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="24" y="836" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#8B8477">Enter sends. Shift + Enter starts a new line.</text></svg>