<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg"><rect width="390" height="844" fill="#FAF8F3"/><text x="26" y="112" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1.2" fill="#8B8477">STILLWATER</text><rect x="24" y="120" width="300" height="52" rx="18" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1"/><path d="M24 164 h12 v6 z" fill="#E6E1D8"/><text x="40" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#57524A">I'm here. Thank you for telling me</text><text x="40" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#57524A">instead of holding it alone.</text><rect width="390" height="844" fill="#23211E" opacity="0.28"/><rect x="0" y="180" width="390" height="664" rx="26" fill="#FAF8F3"/><rect x="174" y="198" width="42" height="4" rx="2" fill="#E0D9CC"/><text x="24" y="246" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#23211E">A minute of</text><text x="24" y="276" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#23211E">something simple</text><text x="24" y="302" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#23211E">No pressure to do this well. We can stop in the middle.</text><circle cx="195" cy="430" r="100" fill="none" stroke="#E0E8E1"/><circle cx="195" cy="430" r="86" fill="#E5EDE6" stroke="#C9D8CC"/><text x="195" y="436" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#4E6B57" text-anchor="middle">Breathe in</text><text x="30" y="560" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8B8477">1</text><text x="58" y="560" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#23211E">Let your shoulders drop, wherever they are.</text><line x1="24" y1="574" x2="366" y2="574" stroke="#EDE7DC"/><text x="30" y="602" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8B8477">2</text><text x="58" y="602" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#23211E">Breathe out a little longer than you breathe in.</text><line x1="24" y1="616" x2="366" y2="616" stroke="#EDE7DC"/><text x="30" y="644" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8B8477">3</text><text x="58" y="644" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#23211E">Name five things you can see.</text><line x1="24" y1="658" x2="366" y2="658" stroke="#EDE7DC"/><text x="30" y="686" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8B8477">4</text><text x="58" y="686" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#23211E">Let your back rest against something solid.</text><line x1="24" y1="700" x2="366" y2="700" stroke="#EDE7DC"/><text x="30" y="728" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8B8477">5</text><text x="58" y="728" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#23211E">Nothing here has to be done right.</text><rect x="24" y="748" width="342" height="44" rx="22.0" fill="#4E6B57"/><text x="195.0" y="774.68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">That's enough for now</text><text x="195" y="812" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8B8477" text-anchor="middle">Go back to the conversation</text></svg>