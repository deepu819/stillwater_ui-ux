<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg"><rect width="390" height="844" fill="#FAF8F3"/><rect width="390" height="64" fill="#FAF8F3"/><line x1="0" y1="64" x2="390" y2="64" stroke="#EDE7DC"/><text x="24" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#23211E">Stillwater</text><rect x="120" y="22" width="122" height="24" rx="12" fill="#F2EDE4"/><circle cx="134" cy="34" r="3.5" fill="#6E8B75"/><text x="144" y="38" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#57524A">quiet-river-42</text><text x="258" y="38" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#57524A">Talk to a human</text><text x="366" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#8B8477" text-anchor="end">···</text><rect x="150" y="96" width="216" height="42" rx="18" fill="#E5EDE6"/><text x="350" y="122.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2B3A2F" text-anchor="end">i want to die</text><text x="26" y="172" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1.2" fill="#8B8477">STILLWATER</text><rect x="24" y="180" width="288" height="52" rx="18" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1"/><path d="M24 224 h12 v6 z" fill="#E6E1D8"/><text x="40" y="206" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#57524A">I'm here. Thank you for telling me</text><text x="40" y="226" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#57524A">instead of holding it alone.</text><text x="26" y="238" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1.2" fill="#8B8477">STILLWATER</text><rect x="24" y="246" width="300" height="70" rx="18" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1"/><path d="M24 308 h12 v6 z" fill="#E6E1D8"/><text x="40" y="272" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#57524A">You don't have to solve anything</text><text x="40" y="292" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#57524A">in this conversation. I'd just like to</text><text x="40" y="312" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#57524A">keep you company right now.</text><rect x="24" y="330" width="342" height="188" rx="20" fill="#F4E8E0" stroke="#D9B79F" stroke-width="1"/><text x="44" y="360" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#57524A">I want you to have more than I can</text><text x="44" y="380" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#57524A">give. There are people trained for</text><text x="44" y="400" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#57524A">this, free, any hour. I can put their</text><text x="44" y="420" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#57524A">details on the screen, or we can</text><text x="44" y="440" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#57524A">stay here. Both are fine.</text><rect x="42" y="458" width="176" height="34" rx="17" fill="#FFFFFF" stroke="#D9B79F" stroke-width="1"/><text x="130" y="480" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#57524A" text-anchor="middle">Show me who I can talk to</text><rect x="226" y="458" width="122" height="34" rx="17" fill="#FFFFFF" stroke="#D9B79F" stroke-width="1"/><text x="287" y="480" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#57524A" text-anchor="middle">Stay here with me</text><rect x="16" y="756" width="358" height="58" rx="29" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1"/><text x="38" y="791" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#8B8477">Type whatever is there. Short is fine.</text><circle cx="344" cy="785" r="19" fill="#4E6B57"/><path d="M337 785 h13 M345 779 l6 6 -6 6" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>