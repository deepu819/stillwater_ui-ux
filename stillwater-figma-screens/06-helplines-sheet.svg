<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg"><rect width="390" height="844" fill="#FAF8F3"/><rect width="390" height="844" fill="#FAF8F3"/><rect x="150" y="96" width="216" height="42" rx="18" fill="#E5EDE6"/><text x="350" y="122.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2B3A2F" text-anchor="end">i want to die</text><text x="26" y="152" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1.2" fill="#8B8477">STILLWATER</text><rect x="24" y="160" width="300" height="52" rx="18" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1"/><path d="M24 204 h12 v6 z" fill="#E6E1D8"/><text x="40" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#57524A">I'm here. Thank you for telling me</text><text x="40" y="206" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#57524A">instead of holding it alone.</text><rect width="390" height="844" fill="#23211E" opacity="0.28"/><rect x="0" y="300" width="390" height="544" rx="26" fill="#FAF8F3"/><rect x="174" y="318" width="42" height="4" rx="2" fill="#E0D9CC"/><text x="24" y="366" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#23211E">People who answer,</text><text x="24" y="396" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#23211E">any hour</text><text x="24" y="424" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#57524A">These calls are free and confidential. Nobody will</text><text x="24" y="442" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#57524A">be sent to you. You can also keep this list and</text><text x="24" y="460" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#57524A">not call.</text><rect x="24" y="478" width="342" height="54" rx="14" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1"/><text x="40" y="500" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#23211E">Tele-MANAS (Govt. of India)</text><text x="40" y="520" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4E6B57">14416</text><text x="350" y="512" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8B8477" text-anchor="end">24 x 7</text><rect x="24" y="540" width="342" height="54" rx="14" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1"/><text x="40" y="562" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#23211E">KIRAN Mental Health Helpline</text><text x="40" y="582" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4E6B57">1800-599-0019</text><text x="350" y="574" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8B8477" text-anchor="end">24 x 7</text><rect x="24" y="602" width="342" height="54" rx="14" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1"/><text x="40" y="624" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#23211E">AASRA</text><text x="40" y="644" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4E6B57">+91 98204 66726</text><text x="350" y="636" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8B8477" text-anchor="end">24 x 7</text><rect x="24" y="664" width="342" height="54" rx="14" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1"/><text x="40" y="686" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#23211E">iCall (TISS)</text><text x="40" y="706" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4E6B57">+91 91529 87821</text><text x="350" y="698" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8B8477" text-anchor="end">10am-8pm</text><rect x="24" y="726" width="342" height="54" rx="14" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1"/><text x="40" y="748" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#23211E">Emergency services</text><text x="40" y="768" font-family="Arial, Helvetica, sans-serif" fo