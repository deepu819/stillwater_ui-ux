<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg"><rect width="390" height="844" fill="#FAF8F3"/><text x="24" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#23211E">Stillwater</text><text x="366" y="48" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57524A" text-anchor="end">Helplines</text><line x1="0" y1="64" x2="390" y2="64" stroke="#EDE7DC"/><text x="24" y="150" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2.2" fill="#8B8477">SOMEONE IS HERE</text><text x="24" y="204" font-family="Georgia, 'Times New Roman', serif" font-size="33" fill="#23211E">You don't have to</text><text x="24" y="244" font-family="Georgia, 'Times New Roman', serif" font-size="33" fill="#23211E">explain it well.</text><text x="24" y="290" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#57524A">This is a quiet text window. No name, no form,</text><text x="24" y="312" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#57524A">no questions you must answer. Type as little</text><text x="24" y="334" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#57524A">as you want, or nothing at all.</text><rect x="24" y="370" width="196" height="48" rx="24.0" fill="#4E6B57"/><text x="122.0" y="399.4" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle">Start quietly</text><rect x="232" y="370" width="134" height="48" rx="24.0" fill="none" stroke="#E6E1D8" stroke-width="1"/><text x="299.0" y="398.68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57524A" text-anchor="middle">Just show me</text><rect x="24" y="456" width="342" height="82" rx="18" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1"/><text x="44" y="484" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#23211E">Nothing is required</text><text x="44" y="506" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57524A">You can pause, leave, or delete this</text><text x="44" y="524" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57524A">conversation at any moment.</text><rect x="24" y="550" width="342" height="82" rx="18" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1"/><text x="44" y="578" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#23211E">No name, no account</text><text x="44" y="600" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57524A">You get a random word-name for today.</text><text x="44" y="618" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57524A">Nothing links back to you.</text><rect x="24" y="644" width="342" height="82" rx="18" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1"/><text x="44" y="672" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#23211E">No judgement</text><text x="44" y="694" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57524A">There is no correct way to use this,</text><text x="44" y="712" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57524A">and no wrong thing to say.</text><rect x="24" y="752" width="342" height="52" rx="16" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1"/><text x="44" y="774" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#23211E">What happens to what I write?</text><text x="348" y="776" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8B8477" text-anchor="end">+</text><text x="24" y="822" font-family="Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#8B8477">An academic prototype. Not a clinical service.</text></svg>