<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg"><rect width="390" height="844" fill="#FAF8F3"/><text x="24" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#23211E">Stillwater</text><line x1="0" y1="64" x2="390" y2="64" stroke="#EDE7DC"/><text x="24" y="130" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2.2" fill="#8B8477">BEFORE YOU TYPE</text><text x="24" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#23211E">What happens to</text><text x="24" y="210" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#23211E">what I write?</text><rect x="24" y="242" width="342" height="392" rx="18" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1"/><text x="44" y="286" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57524A">Your words are not stored by default.</text><text x="44" y="306" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57524A">Only the fact that someone spoke to us</text><text x="44" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57524A">today is counted.</text><text x="44" y="364" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57524A">If you turn on "keep my words", then and</text><text x="44" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57524A">only then are your sentences saved.</text><text x="44" y="424" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57524A">No cookies, so nothing follows you to</text><text x="44" y="444" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57524A">other sites. Closing the tab ends it.</text><text x="44" y="484" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57524A">We never ask for your name, phone,</text><text x="44" y="504" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57524A">email or location, and we do not log</text><text x="44" y="524" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57524A">your IP address.</text><text x="44" y="564" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57524A">This is a simple rule-based guide, not a</text><text x="44" y="584" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57524A">person and not an AI model. A trained</text><text x="44" y="604" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57524A">human is always one tap away.</text><rect x="24" y="660" width="342" height="48" rx="24.0" fill="#4E6B57"/><text x="195.0" y="689.4" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle">Continue</text><text x="195" y="740" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8B8477" text-anchor="middle">Change my mind</text><text x="24" y="790" font-family="Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#8B8477">You can leave at any point, without explaining.</text></svg>